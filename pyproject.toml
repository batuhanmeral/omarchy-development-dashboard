[project]
name = "omarchy-development-dashboard"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
"tools/*" = ["S603", "S607"]

[tool.pyright]
include = ["backend"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
